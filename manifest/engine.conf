# Godot versions this machine should have installed.
#
# To upgrade: add the new version, set GODOT_DEFAULT, record its sha512 from
#   https://github.com/godotengine/godot/releases/download/<v>-stable/SHA512-SUMS.txt
# then commit and run bootstrap.sh on each machine.
#
# Checksum vars are named GODOT_SHA_<version with dots as underscores> and
# GODOT_TPZ_SHA_<same>. Leave a TPZ sum empty to skip export templates for
# that version.

GODOT_VERSIONS=(4.7.1)
GODOT_DEFAULT=4.7.1

GODOT_SHA_4_7_1=4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9
GODOT_TPZ_SHA_4_7_1=afcc83d8d3d298038f19c58744a0d660fa75dd4baa33cb55d1011bb2565a2a8c2381728924564cb909e37c205a23f21b521b23bd057993afd43ae4da0b2f9d47

# Export templates are ~1 GB per version. Set to 0 to skip them entirely on a
# machine that only edits and never exports builds.
INSTALL_EXPORT_TEMPLATES=1

# Directories searched for an already-downloaded archive before downloading.
CACHE_DIRS=("$HOME/Downloads" "$GAMES_ROOT/engine/.cache")
