# Directories bootstrap.sh guarantees exist, relative to $GAMES_ROOT.
#
# Only the tree is version controlled -- the contents of library/, source/ and
# exports/ are deliberately outside git. See sync.sh for restoring those.

STRUCTURE_DIRS=(
  engine
  engine/.cache
  projects
  sandbox
  exports

  library
  library/audio/sfx
  library/audio/music
  library/audio/voice
  library/art/sprites
  library/art/textures
  library/art/ui
  library/art/hdri
  library/models
  library/fonts
  library/shaders

  source
)
